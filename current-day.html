<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Robotics &amp; Coding</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #111; overflow: hidden;
  }
  #board-frame {
    display: block; width: 100vw; height: 100vh; border: none;
  }
  #board-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #999; background: #111; font-size: 1.1rem; letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div id="board-loading">Loading today&rsquo;s agenda&hellip;</div>
<iframe id="board-frame" title="Today's agenda" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>

<script src="script.js"></script>
<script>
  // This page never navigates itself — the address bar always stays on
  // current-day.html, so it's safe to bookmark and safe to refresh at any
  // time. Instead, it holds an iframe pointed at whichever page is "live"
  // right now (via resolveLivePage() from script.js) and swaps the
  // iframe's src whenever that changes. That means it self-updates on its
  // own — no refresh needed — the instant a period ends, an after-school
  // special kicks in, or midnight rolls over into a new school day.
  //
  // resolveLivePage() returns one of four pages: the live class agenda,
  // Study Hall (the default whenever nothing else is scheduled — before
  // school, or after school with no special active), VEX Club (Mon 3pm+,
  // Sat 8am+), or Tutoring (Tue 3pm+). It always swaps back to the live
  // class agenda at the end of 3rd period.
  const frame = document.getElementById('board-frame');
  const loadingEl = document.getElementById('board-loading');
  let shown = { type: null, dateStr: null, period: null };

  function frameUrl(page) {
    if (page.type === 'agenda') {
      const slug = page.period ? PERIOD_SLUG[page.period] : null;
      return `agenda.html?date=${page.dateStr}` + (slug ? `&period=${slug}` : '');
    }
    if (page.type === 'vex') return 'vex.html';
    if (page.type === 'tutoring') return 'tutoring.html';
    return 'study-hall.html'; // default / fallback
  }

  async function sync() {
    const page = await resolveLivePage();
    if (page.type === shown.type && page.dateStr === shown.dateStr && page.period === shown.period) {
      return; // nothing changed — leave the iframe alone
    }
    shown = { type: page.type, dateStr: page.dateStr || null, period: page.period || null };
    frame.src = frameUrl(page);
  }

  frame.addEventListener('load', () => {
    loadingEl.style.display = 'none';
    frame.style.display = 'block';
  });

  sync();
  setInterval(sync, 15000); // check every 15s; only actually reloads the iframe when the date or period changes
</script>

</body>
</html>
