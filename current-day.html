<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Robotics &amp; Coding</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #111; overflow: hidden;
  }
  #board-frame {
    display: block; width: 100vw; height: 100vh; border: none;
  }
  #board-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #999; background: #111; font-size: 1.1rem; letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div id="board-loading">Loading today&rsquo;s agenda&hellip;</div>
<iframe id="board-frame" title="Today's agenda" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>

<script src="script.js"></script>
<script>
  // This page never navigates itself — the address bar always stays on
  // current-day.html, so it's safe to bookmark and safe to refresh at any
  // time. Instead, it holds an iframe pointed at whichever date + period
  // is "live" right now (via resolveLiveDateAndPeriod() from script.js)
  // and swaps the iframe's src whenever that changes. That means it
  // self-updates on its own — no refresh needed — the instant a period
  // ends or midnight rolls over into a new school day.
  const frame = document.getElementById('board-frame');
  const loadingEl = document.getElementById('board-loading');
  let shown = { dateStr: null, period: null };

  function frameUrl(dateStr, period) {
    const slug = period ? PERIOD_SLUG[period] : null;
    return `agenda.html?date=${dateStr}` + (slug ? `&period=${slug}` : '');
  }

  async function sync() {
    const { dateStr, period } = await resolveLiveDateAndPeriod();
    if (dateStr === shown.dateStr && period === shown.period) return; // nothing changed — leave the iframe alone
    shown = { dateStr, period };
    frame.src = frameUrl(dateStr, period);
  }

  frame.addEventListener('load', () => {
    loadingEl.style.display = 'none';
    frame.style.display = 'block';
  });

  sync();
  setInterval(sync, 15000); // check every 15s; only actually reloads the iframe when the date or period changes
</script>

</body>
</html>
