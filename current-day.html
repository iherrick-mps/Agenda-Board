<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Robotics &amp; Coding</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #111; overflow: hidden;
  }
  #board-frame {
    display: block; width: 100vw; height: 100vh; border: none;
  }
  #board-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #999; background: #111; font-size: 1.1rem; letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div id="board-loading">Loading today&rsquo;s agenda&hellip;</div>
<iframe id="board-frame" title="Today's agenda" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>

<script src="script.js?v=202611091951"></script>
<script>
  // This page never navigates itself — the address bar always stays on
  // current-day.html, so it's safe to bookmark and safe to refresh at any
  // time. Instead, it holds an iframe pointed at whichever page is "live"
  // right now (via resolveLivePage() from script.js) and swaps the
  // iframe's src whenever that changes. That means it self-updates on its
  // own — no refresh needed — the instant a period ends, an after-school
  // special kicks in, or midnight rolls over into a new school day.
  //
  // resolveLivePage() returns one of five pages: the live class agenda,
  // the Day Overview (from the 1st period bell through the end of 3rd
  // period — both tracks' plans side by side while she isn't teaching
  // yet), Study Hall (the default whenever nothing else is scheduled —
  // before school, or after school with no special active), VEX Club
  // (Mon 3pm+, Sat 8am+), or Tutoring (Tue 3pm+). It always swaps from
  // the Day Overview to the live class agenda at the end of 3rd period.
  const frame = document.getElementById('board-frame');
  const loadingEl = document.getElementById('board-loading');
  let shownUrl = null;

  // Cache-busting version, read off this page's own <script src="script.js?v=...">
  // rather than written out again here, so there is only ever one version
  // number in the file to bump. Every page this board loads into the iframe
  // gets it too: without it the browser (or a school network's caching proxy)
  // happily serves yesterday's agenda.html — and therefore yesterday's
  // stylesheet link — for the same date+period URL, and a style change stays
  // invisible on the projector no matter how hard anyone refreshes.
  const ASSET_V = (function () {
    const tag = document.querySelector('script[src^="script.js"]');
    const m = tag && tag.getAttribute('src').match(/[?&]v=([^&]+)/);
    return m ? m[1] : '';
  })();
  const vq = ASSET_V ? `v=${ASSET_V}` : '';

  function frameUrl(page) {
    if (page.type === 'agenda') {
      const slug = page.period ? PERIOD_SLUG[page.period] : null;
      return `agenda.html?date=${page.dateStr}` + (slug ? `&period=${slug}` : '') +
             (vq ? `&${vq}` : '');
    }
    if (page.type === 'overview') {
      return `overview.html?date=${page.dateStr}` + (vq ? `&${vq}` : '');
    }
    if (page.type === 'vex') return 'vex.html' + (vq ? `?${vq}` : '');
    if (page.type === 'tutoring') return 'tutoring.html' + (vq ? `?${vq}` : '');
    return 'study-hall.html' + (vq ? `?${vq}` : ''); // default / fallback
  }

  async function sync() {
    const url = frameUrl(await resolveLivePage());
    // Compare the finished URL, not the individual fields. The non-agenda
    // pages (study-hall / vex / tutoring) come back with no dateStr and no
    // period, so field-by-field checks ended up comparing undefined against
    // null, never matched, and re-set frame.src every 15 seconds — which
    // restarted whatever video or playlist was playing. Comparing the URL
    // string means the iframe is only ever touched when the page truly
    // changes.
    if (url === shownUrl) return; // nothing changed — leave the iframe (and the music) alone
    shownUrl = url;
    frame.src = url;
  }

  frame.addEventListener('load', () => {
    loadingEl.style.display = 'none';
    frame.style.display = 'block';
  });

  sync();
  setInterval(sync, 15000); // check every 15s; only actually reloads the iframe when the date or period changes
</script>

</body>
</html>
